; ORmeter firmware -- PlatformIO.
;
; ONE device: the Waveshare ESP32-S3-Touch-AMOLED-1.8 (368x448). No board
; matrix, no per-board dispatch, no shared HAL indirection -- the board API is
; called directly.
;
; Envs:
;   sim                  host-side render harness. Builds LVGL for the host and
;                        renders screens into a memory buffer, writing a BMP.
;                        No SDL, no window, no device, no flash. This is how
;                        layout questions get answered without burning a flash
;                        cycle, and what CI runs to prove rendering still works.
;   waveshare_amoled_18  the device itself (build + flash).
;
; NOTE: the platform below is the pioarduino fork, which requires
; PlatformIO Core >= 6.1.19. flash.sh enforces that gate.

[platformio]
default_envs = sim

; ---------------------------------------------------------------------------
; Host-side render harness
; ---------------------------------------------------------------------------
[env:sim]
platform = native
; fonts/ is shared with the device build on purpose: the harness must measure
; the SAME glyphs the device renders, or its numbers are about a different font.
build_src_filter =
    -<*>
    +<sim/>
    +<fonts/>
build_flags =
    -std=gnu++17
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_LABEL=1
    -DLV_USE_BAR=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMAGE=1
    -DLV_USE_SNAPSHOT=1
lib_deps =
    lvgl/lvgl@^9.2.0

; ---------------------------------------------------------------------------
; The device
; ---------------------------------------------------------------------------
[env:waveshare_amoled_18]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
upload_speed = 921600
monitor_speed = 115200
build_src_filter =
    -<*>
    -<sim/>
    +<meter/>
    +<fonts/>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DXPOWERS_CHIP_AXP2101
    ; NimBLE: peripheral + broadcaster only, and deliberately TWO simultaneous
    ; connections. The OS holds a HID keyboard link (BOOT button -> Space) while
    ; the host daemon holds its own link to the data service. Both must coexist:
    ; dropping to one connection breaks the keyboard, and the data link is what
    ; carries the payload.
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    ; Peripheral Preferred Connection Parameters. Not tuning -- this is the fix
    ; for Windows supervision-timeout churn on this link.
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_MIN_CONN_INTERVAL=12
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_MAX_CONN_INTERVAL=24
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_SLAVE_LATENCY=0
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_SUPERVISION_TMO=600
    ; LVGL configured entirely by flags (no lv_conf.h).
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1
    -DLV_USE_SNAPSHOT=1
lib_deps =
    moononournation/GFX Library for Arduino@^1.6.4
    lewisxhe/SensorLib@^0.2.6
    lewisxhe/XPowersLib@^0.2.7
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^2.1.1
